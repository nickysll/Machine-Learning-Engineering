services:
  mlflow:
    build:
      context: .
      target: runtime
    image: tech-challenge-fase-02:latest
    ports:
      - "5000:5000"
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    volumes:
      - mlflow-data:/mlflow

  pipeline:
    build:
      context: .
      target: runtime
    image: tech-challenge-fase-02:latest
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command:
      - dvc
      - repro
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports

volumes:
  mlflow-data:
